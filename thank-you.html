<style>
  html, body { margin: 0; padding: 0; background: #f7f5ef; }

    65% { opacity: 1; transform: translateY(0) scale(1.035); }
    100% { opacity: 1; transform: translateY(0) scale(1); }

  @keyframes ty-glow {

  }
  @keyframes ty-sweep {
    0% { transform: translateX(-140%) skewX(-18deg); }
    38%, 100% { transform: translateX(320%) skewX(-18deg); }
  }
  @keyframes ty-ring { 0%,100% { opacity: .7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } }
  @keyframes ty-drift { 0%,100% { opacity: .35; } 50% { opacity: .7; } }

    .lp-export-audit-thankyou *, .lp-export-audit-thankyou *::before, .lp-export-audit-thankyou *::after {

      <span>Join the WhatsApp Group →</span>

    <p style="margin: 0; max-width: 42ch; font-size: clamp(12.5px, 1.5vw, 14.5px); line-height: 1.55; color: rgba(28,51,88,.66); animation: ty-rise .8s cubic-bezier(.22,.9,.3,1) .55s both;">

  </section>
